<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>แจ้งเหตุฉุกเฉิน (User Interface)</title>
  
  <!-- Font & Leaflet CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-dark: #0a0e17;
      --bg-glass: rgba(18, 25, 41, 0.65);
      --border-glass: rgba(255, 255, 255, 0.08);
      --accent-teal: #00d4ff;
      --accent-red: #ff3b3b;
      --text-main: #f0f4f8;
      --text-muted: #8b9bb4;
    }

    body { 
      font-family: 'Inter', system-ui, sans-serif; 
      padding: 20px; 
      background: var(--bg-dark); 
      color: var(--text-main);
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      margin: 0; 
      box-sizing: border-box;
      overflow-x: hidden;
      position: relative;
    }

    /* Animated Background Layer */
    .bg-animation {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    /* Emergency Siren Pulse */
    .siren-pulse {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: 
        radial-gradient(circle at 10% 10%, rgba(255, 59, 59, 0.08), transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(0, 212, 255, 0.08), transparent 40%);
      animation: sirenFloat 8s infinite alternate ease-in-out;
    }

    .siren-flash {
      position: absolute;
      width: 100vw;
      height: 100vh;
      opacity: 0.15;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .flash-red { background: radial-gradient(circle at 0% 0%, var(--accent-red), transparent 50%); animation: flashRed 6s infinite; }
    .flash-blue { background: radial-gradient(circle at 100% 100%, var(--accent-teal), transparent 50%); animation: flashBlue 6s infinite 3s; }

    /* Digital Grid */
    .grid-lines {
      position: absolute;
      width: 200%;
      height: 200%;
      top: -50%;
      left: -50%;
      background-image: 
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      transform: perspective(500px) rotateX(60deg);
      animation: gridMove 20s linear infinite;
    }

    @keyframes sirenFloat {
      from { transform: scale(1); }
      to { transform: scale(1.1); }
    }

    @keyframes flashRed {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.2; }
    }

    @keyframes flashBlue {
      0%, 100% { opacity: 0; }
      50% { opacity: 0.2; }
    }

    @keyframes gridMove {
      from { background-position: 0 0; }
      to { background-position: 0 500px; }
    }

    .card { 
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 32px; 
      border-radius: 16px; 
      border: 1px solid var(--border-glass);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      width: 100%; 
      max-width: 900px; 
      display: flex;
      flex-direction: row;
      gap: 32px;
    }

    @media (max-width: 768px) {
      .card { flex-direction: column-reverse; padding: 20px; }
    }

    .form-column, .map-column {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-glass);
      padding-bottom: 16px;
    }

    h2 { 
      margin: 0 0 4px 0; 
      color: var(--text-main); 
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    p.subtitle { 
      font-size: 12px; 
      color: var(--text-muted); 
      margin: 0;
    }

    label { 
      font-size: 13px; 
      font-weight: 500; 
      color: var(--text-muted); 
      display: block; 
      margin-top: 16px; 
      margin-bottom: 6px;
    }

    input, select { 
      width: 100%; 
      box-sizing: border-box;
      padding: 12px; 
      background: rgba(10, 14, 23, 0.4);
      border: 1px solid var(--border-glass); 
      color: var(--text-main);
      border-radius: 8px; 
      font-size: 14px; 
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      border-color: var(--accent-teal);
      background: rgba(0, 212, 255, 0.05);
    }

    select option {
      background: var(--bg-dark);
      color: var(--text-main);
    }

    button { 
      width: 100%; 
      padding: 14px; 
      margin-top: auto; /* Push button to bottom */
      background: rgba(255, 59, 59, 0.1);
      color: var(--accent-red); 
      border: 1px solid rgba(255, 59, 59, 0.3); 
      border-radius: 8px; 
      font-weight: 600; 
      font-size: 15px; 
      cursor: pointer; 
      transition: all 0.3s ease; 
      letter-spacing: 0.5px;
    }

    button:hover { 
      background: var(--accent-red);
      color: #fff;
      box-shadow: 0 0 15px rgba(255, 59, 59, 0.3);
    }

    /* Map Styles */
    .map-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    
    .map-header h3 {
      font-size: 14px;
      margin: 0;
      color: var(--text-main);
      font-weight: 500;
    }

    .locate-btn {
      background: transparent;
      border: 1px solid var(--accent-teal);
      color: var(--accent-teal);
      padding: 4px 12px;
      font-size: 11px;
      border-radius: 20px;
      margin-top: 0;
      width: auto;
    }
    .locate-btn:hover {
      background: rgba(0, 212, 255, 0.1);
      box-shadow: none;
      color: var(--accent-teal);
    }

    #map {
      flex: 1;
      width: 100%;
      min-height: 300px;
      border-radius: 12px;
      border: 1px solid var(--border-glass);
      background: rgba(10, 14, 23, 0.8);
    }
    
    /* Darken leaflet generic popups */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background: var(--bg-dark) !important;
      color: var(--text-main) !important;
      border: 1px solid var(--border-glass);
    }
  </style>
</head>
<body>
  <div class="bg-animation">
    <div class="grid-lines"></div>
    <div class="siren-pulse"></div>
    <div class="siren-flash flash-red"></div>
    <div class="siren-flash flash-blue"></div>
  </div>

  <div class="card">
    
    <!-- Left form section -->
    <div class="form-column">
      <div class="header">
        <h2>🚨 แจ้งเหตุฉุกเฉิน</h2>
        <p class="subtitle">Neural Hospital Incident Report</p>
      </div>

      <label>ชื่อผู้แจ้งเหตุ:</label>
      <input type="text" id="reporterName" placeholder="ระบุชื่อ-นามสกุล">
      
      <label>เบอร์ติดต่อ:</label>
      <input type="tel" id="reporterPhone" placeholder="ระบุเบอร์โทรศัพท์">

      <label>หัวข้ออุบัติเหตุ:</label>
      <input type="text" id="title" value="พบคนหมดสติ">
      
      <label>รายละเอียด / ข้อมูลเพิ่มเติม:</label>
      <input type="text" id="desc" value="ไม่ทราบสาเหตุ อยู่ใกล้สวนสาธารณะ">
      
      <label>ระดับความรุนแรง:</label>
      <select id="severity">
        <option value="critical">วิกฤต (Critical)</option>
        <option value="high">สูง (High)</option>
        <option value="medium" selected>ปานกลาง (Medium)</option>
        <option value="low">ต่ำ (Low)</option>
      </select>

      <button id="sendBtn" onclick="sendAlert()">ส่งข้อมูลพิกัด (Send Alert)</button>
    </div>

    <!-- Right map section -->
    <div class="map-column">
      <div class="map-header">
        <h3>📍 แตะเพื่อปักหมุดตำแหน่งเกิดเหตุ</h3>
        <button class="locate-btn" onclick="locateUser()">ค้นหาตำแหน่งปัจจุบันของฉัน</button>
      </div>
      <div id="map"></div>
    </div>
    
  </div>

  <!-- Leaflet Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, marker;
    let selectedLat = 16.4600; // Center of KKU
    let selectedLng = 102.8240;

    // Custom Red Icon for User Marker
    const redIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
      shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.7.1/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
    });

    document.addEventListener("DOMContentLoaded", () => {
      // Initialize map
      map = L.map('map').setView([selectedLat, selectedLng], 14);

      // Dark theme map tiles
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; CARTO'
      }).addTo(map);

      // Add KKU Boundary Frame
      const kkuBoundary = [
        [16.4850, 102.8100],
        [16.4850, 102.8380],
        [16.4350, 102.8380],
        [16.4350, 102.8100]
      ];
      L.polygon(kkuBoundary, {
        color: '#ffffff', // White frame as requested
        fillColor: '#00d4ff',
        fillOpacity: 0.05,
        weight: 2,
        dashArray: '5, 10'
      }).addTo(map).bindPopup('ขอบเขตพื้นที่รับแจ้งเหตุ (KKU Area)');


      // Initial Draggable Marker
      marker = L.marker([selectedLat, selectedLng], { icon: redIcon, draggable: true }).addTo(map)
        .bindPopup('จุดเกิดเหตุ (เลื่อนหมุดได้)').openPopup();

      // Boundary definition
      const kkuBounds = L.latLngBounds([16.4350, 102.8100], [16.4850, 102.8380]);

      // Setup drag event
      marker.on('dragend', function (e) {
        const position = marker.getLatLng();
        if (!kkuBounds.contains(position)) {
          alert('🚫 อยู่นอกพื้นที่รับแจ้ง! กรุณาปักหมุดภายในกรอบสีขาว');
          marker.setLatLng([selectedLat, selectedLng]); // Snap back
        } else {
          selectedLat = position.lat;
          selectedLng = position.lng;
        }
      });

      // Setup map click event to move marker
      map.on('click', function(e) {
        if (kkuBounds.contains(e.latlng)) {
          selectedLat = e.latlng.lat;
          selectedLng = e.latlng.lng;
          marker.setLatLng([selectedLat, selectedLng]);
        } else {
          alert('🚫 กรุณาคลิกภายในกรอบพื้นที่ ม.ขอนแก่น');
        }
      });
    });

    function locateUser() {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const userLoc = L.latLng(position.coords.latitude, position.coords.longitude);
            const kkuBounds = L.latLngBounds([16.4350, 102.8100], [16.4850, 102.8380]);
            
            if (kkuBounds.contains(userLoc)) {
              selectedLat = userLoc.lat;
              selectedLng = userLoc.lng;
              map.setView([selectedLat, selectedLng], 16);
              marker.setLatLng([selectedLat, selectedLng]);
            } else {
              alert('📍 ตำแหน่งปัจจุบันของคุณอยู่นอกพื้นที่ ม.ขอนแก่น');
              map.fitBounds(kkuBounds);
            }
          },
          () => {
            console.log('Location access denied or unavailable.');
          }
        );
      }
    }

    function sendAlert() {
      const btn = document.getElementById('sendBtn');
      const originalText = btn.innerHTML;
      btn.innerHTML = "กำลังส่งข้อมูล...";
      btn.style.opacity = "0.7";
      
      const payload = {
        reporterName: document.getElementById('reporterName').value,
        reporterPhone: document.getElementById('reporterPhone').value,
        title: document.getElementById('title').value,
        desc: document.getElementById('desc').value,
        severity: document.getElementById('severity').value,
        lat: selectedLat, // Use the map coordinates
        lng: selectedLng
      };

      fetch('http://localhost:5002/api/incidents', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      }).then(r => {
        if(r.ok) {
          btn.innerHTML = "✅ ส่งข้อมูลสำเร็จ!";
          btn.style.background = "#4caf50";
          btn.style.color = "#fff";
          btn.style.borderColor = "#4caf50";
          
          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style = "";
          }, 4000); // 4 seconds green confirmation
        } else {
          alert('บางอย่างผิดพลาด');
          btn.innerHTML = originalText;
        }
      }).catch(e => {
        alert('Failed to connect to server');
        btn.innerHTML = originalText;
      });
    }
  </script>
</body>
</html>
